name: mbt

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Replay a seed (leave empty for a new one)
        default: ""
      walkLength:
        description: Steps in the random walk
        default: "2000"

jobs:
  mbt:
    runs-on: ubuntu-latest
    env:
      # Nightly runs walk further than push runs.
      WALK_LENGTH: ${{ inputs.walkLength || (github.event_name == 'schedule' && '20000') || '2000' }}
      SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the system under test
        uses: actions/checkout@v4
        with:
          repository: dobdaniel1/payment-switch-simulator
          path: switch

      - name: Start the switch with PostgreSQL
        run: docker compose -f switch/docker-compose.yml up -d --build --wait

      # GraphWalker 4.3.3 runs on Java 17 to 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Walk the model
        run: mvn -B test -Dmbt.walkLength="$WALK_LENGTH" -Dmbt.seed="$SEED"

      - name: Upload coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphwalker
          path: |
            target/graphwalker
            target/surefire-reports

      - name: Switch logs on failure
        if: failure()
        run: docker compose -f switch/docker-compose.yml logs api

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Builds the page from the model; fails if any part of the model has no wording.
      - name: Build the model page
        run: mvn -B test -Dtest=ModelPageTest

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: target/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [mbt, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
